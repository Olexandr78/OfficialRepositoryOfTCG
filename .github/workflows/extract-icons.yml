name: Extract APK icons

on:
  push:
    paths:
      - 'apks/**'
  workflow_dispatch:

jobs:
  extract-icons:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Extract icons from APKs
        run: |
          python3 scripts/extract_icons.py apks --out-dir icons

      - name: Commit generated icons
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons
          if git diff --cached --quiet; then
            echo "No icon changes detected."
          else
            git commit -m "Add extracted APK icons"
            git push
          fi
